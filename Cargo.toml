[workspace]
resolver = "2"
members = ["projects/crates/deck", "projects/crates/napi"]
default-members = ["projects/crates/napi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenPPT Authors"]
repository = "https://github.com/nyar-os/OpenPPT"

[workspace.dependencies]
# Shared host facade for the Node-API and WebView surfaces. Cross-repo git
# dependencies pin the full 40-character revision so local builds and CI resolve
# the same commit.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9", default-features = false, features = ["webview"] }

# Editable deck model. It lives upstream in Boost; this repository only binds it.
document-presentation = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7" }
document-presentation-pdf = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7" }
document-presentation-pptx = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7" }
# PresentationML import and the fixed-canvas slide view used by PPTX playback.
# Only the `pptx` feature is enabled so unrelated format adapters stay out.
document-formats = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7", default-features = false, features = ["pptx"] }
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7", default-features = false }
data-encoding = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7" }
serde_json = "1"
# ZIP container writer used to assemble PresentationML packages.
data-binary-zip = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7" }

[profile.release]
lto = true
panic = "abort"
