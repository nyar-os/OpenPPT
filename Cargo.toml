[workspace]
resolver = "2"
members = ["projects/crates/deck", "projects/crates/napi"]
default-members = ["projects/crates/napi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenPPT Authors"]
repository = "https://github.com/nyar-os/OpenPPT"

[workspace.dependencies]
# Shared host facade for the Node-API and WebView surfaces. Cross-repo git
# dependencies pin the full 40-character revision so local builds and CI resolve
# the same commit.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9", default-features = false, features = ["webview"] }

# Editable deck model. It lives upstream in Boost; this repository only binds it.
document-presentation = { git = "https://github.com/oovm/rust-boost", rev = "535fb1f492214bed1fce56657c6d4b3e9b7e127e" }
# PresentationML import and the fixed-canvas slide view used by PPTX playback.
# Only the `pptx` feature is enabled so unrelated format adapters stay out.
document-formats = { git = "https://github.com/oovm/rust-boost", rev = "535fb1f492214bed1fce56657c6d4b3e9b7e127e", default-features = false, features = ["pptx"] }
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "535fb1f492214bed1fce56657c6d4b3e9b7e127e", default-features = false }
data-encoding = { git = "https://github.com/oovm/rust-boost", rev = "535fb1f492214bed1fce56657c6d4b3e9b7e127e" }
serde_json = "1"
# ZIP container writer used to assemble PresentationML packages.
data-binary-zip = { git = "https://github.com/oovm/rust-boost", rev = "535fb1f492214bed1fce56657c6d4b3e9b7e127e" }
# Zlib envelope used to decode PNG image data and re-compress PDF image streams.
data-compression = { git = "https://github.com/oovm/rust-boost", rev = "535fb1f492214bed1fce56657c6d4b3e9b7e127e", features = ["deflate"] }

[profile.release]
lto = true
panic = "abort"
