[workspace]
resolver = "2"
members = ["projects/crates/deck", "projects/crates/napi"]
default-members = ["projects/crates/napi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
authors = ["OpenPPT Authors"]
repository = "https://github.com/nyar-os/OpenPPT"

[workspace.dependencies]
# Shared host facade for the Node-API and WebView surfaces. Cross-repo git
# dependencies pin the full 40-character revision so local builds and CI resolve
# the same commit.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9", default-features = false }

# Editable deck model. It lives upstream in Boost; this repository only binds it.
# The path keeps local development on the same working copy. Replacing it with a
# 40-character git rev pin is the release gate once that revision is published.
document-presentation = { path = "../rust-boost/projects/document/document.presentation" }
base64 = "0.22"
serde_json = "1"

[profile.release]
lto = true
panic = "abort"
